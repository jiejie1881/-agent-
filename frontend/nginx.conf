server {
    listen 80;
    server_name _;
    # Backend accepts up to 5 MiB per receipt. Allow multipart overhead, while
    # retaining the backend's own image/content and 5 MiB validation.
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://backend:8000/health/ready;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
    }

    location /uploads/ {
        # Receipt URLs are authenticated backend endpoints, never public files.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
